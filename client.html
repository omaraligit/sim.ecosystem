<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <title>WebSocket Client</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <button id="add-bunny" class="btn btn-primary">Add Bunny</button>
    <div id="bunny-count" class="text-sm">Bunnies: 0</div>
    <input type="number" id="seed" class="input input-bordered" placeholder="Seed" value="42">
    <button id="set-seed" class="btn btn-primary">Set Seed</button>
    <div id="bunnies" class="">
    </div>
    <script async defer>
        var bunnies = [];
        var world = {
            width: 0,
            height: 0,
            tiles: []
        };
        // Connect to your WebSocket server (use wss:// for secure production connections)
        const socket = new WebSocket('ws://localhost:8080');

        // Triggered when the connection is established
        socket.onopen = function (event) {
            console.log('Connected to the WebSocket server');
            //socket.send('Hello Server!');
        };

        // Triggered when a message is received from the server
        socket.onmessage = function (event) {
            const data = JSON.parse(event.data);
            console.log(data);
            if (data.event === "bunny_update") {
                // add bunny to map div and add id to the div
                let bunnyElement = null;
                if (document.getElementById(`bunny-${data.data.bunny.id}`)) {
                    bunnyElement = document.getElementById(`bunny-${data.data.bunny.id}`);
                } else {
                    bunnyElement = document.createElement(`div`);
                    bunnyElement.id = `bunny-${data.data.bunny.id}`;
                    document.getElementById('bunnies').appendChild(bunnyElement);
                }
                bunnyElement.className = `w-10 h-10 absolute top-${data.data.bunny.x * 10} left-${data.data.bunny.y * 10} text-xs flex items-center justify-center transition-all duration-750 ease-in-out text-sm`;
                bunnyElement.innerHTML = `
                    <div class="rounded-full w-5 h-5 p-1 flex items-center justify-center">🐇</div>
                `;
            }
            if (data.event === "bunny_count_update") {
                document.getElementById('bunny-count').innerHTML = `Bunnies: ${data.data.bunnyCount}`;
            }
            if (data.event === "world_update") {
                world = data.data.world;
                console.log(world);
                document.getElementById('bunnies').className = `flex flex-wrap max-w-[${world.width * 40}px] relative transition-all mx-auto`;
                for (let i = 0; i < world.width; i++) {
                    for (let j = 0; j < world.height; j++) {
                        if (document.getElementById(`tile-${i}-${j}`)) {
                            document.getElementById(`tile-${i}-${j}`).remove();
                        }
                        const tileElement = document.createElement(`div`);
                        tileElement.id = `tile-${i}-${j}`;
                        tileElement.className = `w-10 h-10 bg-base-100 border border-base-200 flex items-center justify-center text-xs text-base-200`;
                        switch (world.tiles[i][j]) {
                            case "tree":
                                tileElement.innerHTML = `
                                    <div>🌳</div>
                                `;
                                break;
                            case "grass":
                                tileElement.innerHTML = `
                                    <div>🌿</div>
                                `;
                                break;
                            case "water":
                                tileElement.innerHTML = `
                                    <div>💧</div>
                                `;
                                break;
                            case "rock":
                                tileElement.innerHTML = `
                                    <div>🪨</div>
                                `;
                                break;
                        }
                        document.getElementById('bunnies').appendChild(tileElement);
                    }
                }
            }

        };

        // Triggered if an error occurs
        socket.onerror = function (error) {
            console.error('WebSocket Error:', error);
        };

        // Triggered when the connection closes
        socket.onclose = function (event) {
            console.log('Connection closed:', event);
        };

        document.getElementById('add-bunny').addEventListener('click', () => {
            socket.send(JSON.stringify({
                event: "sim_add_bunny",
            }));
        });

        document.getElementById('set-seed').addEventListener('click', () => {
            socket.send(JSON.stringify({
                event: "sim_set_seed",
                data: {
                    seed: document.getElementById('seed').value
                },
            }));
        });
    </script>
</body>

</html>
